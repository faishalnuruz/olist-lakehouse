[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-lakehouse"
version = "0.1.0"
description = "A local e-commerce lakehouse with data contracts and quarantine handling."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "pyspark>=3.5,<4",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "datacontract-cli[duckdb]>=1.1,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
